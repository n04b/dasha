# Example deployment of the Compose Dashboard.
#
#   docker compose up -d --build
#
# Mount the directory that holds your other compose projects into /compose
# (read-only). The dashboard scans it recursively and builds the cards.

# TODO: test todo comments in compose files, and add a test for the dashboard itself.

services:
  dasha:
    build: .
    image: dasha:latest
    container_name: dasha
    ports:
      - "80:1337"   # published on host port 80 -> app listens on 1337 inside
    environment:
      APP_HOST: localhost   # host your browser reaches the services on (card links)
      # Host used to PROBE services. Inside a container `localhost` is the
      # container itself, so probe the Docker host instead. `host.docker.internal`
      # works on Docker Desktop and, via the extra_hosts entry below, on Linux.
      CHECK_HOST: host.docker.internal
      CHECK_INTERVAL: "30"  # availability check interval (seconds)
      PORT: "1337"
      LOG_LEVEL: info
      # Services hidden from the dashboard (comma-separated, matched against
      # service key / container name / image name). Default: hides "dasha" so
      # the dashboard doesn't show a card for itself.
      # HIDE_SERVICES: "dasha"
    # Makes host.docker.internal resolve to the Docker host on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Your compose projects, read-only. Point this at wherever they live.
      - ./examples:/compose:ro
    # Writable icon cache on tmpfs (mode 1777 so the non-root user can write).
    tmpfs:
      - /icons:mode=1777
    # Hardened runtime.
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
