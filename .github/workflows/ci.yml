name: CI

# Releases run themselves: pushing a `v*` tag builds the image and publishes the
# version tags plus `latest`. Everything else is manual — start it from
# Actions -> CI -> "Run workflow" and pick the ref, e.g. `main` for `edge`.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: Build and push the Docker image
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded manual runs, but never a release: half-pushing a
  # multi-arch image would leave the tag broken on Docker Hub.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build frontend
        run: npm --prefix web run build

      - name: Syntax-check server
        run: for f in server/src/*.js; do node --check "$f"; done

  docker:
    name: Build & push image
    needs: build
    runs-on: ubuntu-latest
    # Always publish for a tag; for a manual run, only when "Build and push the
    # Docker image" was ticked. Either way it needs DOCKERHUB_USERNAME (repo
    # Variable) to be set — otherwise the login step would fail on a fresh
    # clone/fork, so the job is skipped instead.
    if: >-
      (github.event_name == 'push' || inputs.push_image)
      && vars.DOCKERHUB_USERNAME != ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/dasha
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/dasha
          readme-filepath: ./DOCKERHUB.md
