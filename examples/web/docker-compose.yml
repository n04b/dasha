# Example project: a couple of well-known services with published ports.
services:
  nginx:
    image: nginx:alpine
    container_name: web-proxy
    # TODO: serve a real config instead of the default page
    ports:
      - "8080:80"
    networks:
      - frontend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # FIXME: the default admin password is committed here; this should be
    #   read from a secret and rotated before any real deployment.

    # Explicit dashboard overrides via compose extensions.
    x-dasha-name: "Grafana Metrics"
    x-dasha-icon: "simple-icons:grafana"
    x-dasha-port: 3000
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - frontend
      - monitoring

networks:
  frontend:
  monitoring:
