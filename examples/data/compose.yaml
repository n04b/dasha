# Example project using the newer compose.yaml name.
services:
  # TODO: pin the postgres minor version and add a named volume for the data
  postgres:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    labels:
      - "com.example.group=admin"
